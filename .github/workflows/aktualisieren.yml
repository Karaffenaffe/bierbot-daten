
      - name: Telegram Bieralarm
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          jetzt = datetime.now(ZoneInfo("Europe/Berlin"))
          heute = jetzt.date().isoformat()

          with open("bierstand.json", encoding="utf-8") as f:
              daten = json.load(f)

          if daten.get("status") != "ok":
              raise ValueError("Keine gueltige Messung")

          abstand = int(daten["vorsprung"])
          datei = Path("alarm-status.json")

          if datei.exists():
              zustand = json.loads(
                  datei.read_text(encoding="utf-8")
              )
          else:
              zustand = {}

          vorher_unter30 = zustand.get("unter30", False)
          unter30 = abstand < 30

          erster_alarm = unter30 and not vorher_unter30

          erinnerung = (
              unter30
              and jetzt.hour >= 17
              and zustand.get("letzte_erinnerung") != heute
          )

          if erster_alarm or erinnerung:
              if erster_alarm:
                  titel = "🚨🍺 Fettleber ist dir auf den Fersen!"
              else:
                  titel = "🔔🍺 Aufholen, ziehs dir ryan!"

              nachricht = (
                  f"{titel}\n\n"
                  f"Karaffenaffe: {daten['karaffenaffe']} Unique\n"
                  f"Fettleber: {daten['fettleber']} Unique\n\n"
                  f"Dein Vorsprung: {abstand} Biere\n"
                  "Du liegst unter der 30-Biere-Grenze!\n\n"
                  f"Messzeit (UTC): {daten['messung']}"
              )

              token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]

              post = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": nachricht
              }).encode("utf-8")

              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=post,
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=20
                  ) as antwort:
                      ergebnis = json.load(antwort)
                  if not ergebnis.get("ok"):
                      raise RuntimeError()
              except Exception:
                  raise RuntimeError(
                      "Telegram-Nachricht fehlgeschlagen"
                  ) from None

              print("Telegram-Nachricht erfolgreich gesendet")

              if erinnerung:
                  zustand["letzte_erinnerung"] = heute
          else:
              print("Keine Telegram-Nachricht notwendig")

          zustand["unter30"] = unter30

          datei.write_text(
              json.dumps(zustand, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alarm-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Bieralarm-Status aktualisieren"
            git pull --rebase origin main
            git push origin main
          fi
