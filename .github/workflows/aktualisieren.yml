
name: Bierbot Daten aktualisieren

on:
  workflow_dispatch:
    inputs:
      resume_untappd:
        description: 'Abrufe nach HTTP 403/429 bewusst wieder freigeben'
        type: boolean
        default: false
  schedule:
    - cron: '7 * * * *'
    - cron: '22,37,52 * * * *'

concurrency:
  group: bierbot-daten-aktualisieren
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Bierstaende abrufen oder Abruf pausieren
        id: abruf
        env:
          SCHEDULE: ${{ github.event.schedule }}
          RESUME_UNTAPPD: ${{ inputs.resume_untappd }}
        run: python scripts/untappd_abruf.py

      - name: Abrufzustand und Bierstand speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bierstand.json alarm-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Bierstand und Abrufzustand aktualisieren"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Einmalige Untappd-Fehlernachricht
        if: steps.abruf.outputs.notify == 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          pfad = Path("alarm-status.json")
          zustand = json.loads(pfad.read_text(encoding="utf-8"))
          abruf = zustand["untappd_abruf"]
          if abruf["modus"] == "pausiert":
              text = (
                  f"🚫 Untappd HTTP {abruf['http_status']}: Abrufe pausiert. "
                  "Bitte Ursache prüfen und danach den Workflow mit "
                  "'resume_untappd' manuell starten."
              )
          else:
              text = (
                  f"⚠️ Untappd HTTP {abruf['http_status']}: "
                  "Abrufe für den Rest des Berliner Tages nur stündlich. "
                  "Morgen wieder alle 15 Minuten."
              )
          post = urllib.parse.urlencode({
              "chat_id": os.environ["CHAT_ID"], "text": text
          }).encode("utf-8")
          req = urllib.request.Request(
              "https://api.telegram.org/bot" + os.environ["BOT_TOKEN"]
              + "/sendMessage", data=post, method="POST"
          )
          with urllib.request.urlopen(req, timeout=20) as res:
              antwort = json.load(res)
          if not antwort.get("ok"):
              raise RuntimeError("Telegram-Versand fehlgeschlagen")
          abruf["benachrichtigt"] = True
          pfad.write_text(
              json.dumps(zustand, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alarm-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Untappd-Fehlerbenachrichtigung speichern"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Telegram Bieralarm
        if: steps.abruf.outputs.fetch == 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          daten = json.loads(
              Path("bierstand.json").read_text(encoding="utf-8")
          )

          if daten.get("status") != "ok":
              raise ValueError("Bierstand ungueltig")

          messung = datetime.fromisoformat(daten["messung"])
          if messung.tzinfo is None:
              raise ValueError("Messzeit ohne Zeitzone")
          alter = (
              datetime.now(timezone.utc) -
              messung.astimezone(timezone.utc)
          ).total_seconds()
          if alter < -300 or alter > 7200:
              raise ValueError("Bierstand nicht aktuell genug")

          jetzt = datetime.now(ZoneInfo("Europe/Berlin"))
          heute = jetzt.date().isoformat()
          vorsprung = int(daten["vorsprung"])
          unter30 = vorsprung < 30

          pfad = Path("alarm-status.json")
          zustand = (
              json.loads(pfad.read_text(encoding="utf-8"))
              if pfad.exists() else {}
          )

          vorher = zustand.get("unter30", False)
          erster_alarm = unter30 and not vorher

          erinnerung = (
              unter30
              and jetzt.hour >= 17
              and zustand.get("letzte_erinnerung") != heute
          )

          if erster_alarm or erinnerung:
              if erster_alarm:
                  titel = "🚨🍺 Fettleber ist dir auf den Fersen!"
              else:
                  titel = "🔔🍺 Aufholen, ziehs dir ryan!"

              nachricht = (
                  f"{titel}\n\n"
                  f"Karaffenaffe: {daten['karaffenaffe']} Unique\n"
                  f"Fettleber: {daten['fettleber']} Unique\n"
                  f"Vorsprung: {vorsprung} Biere\n\n"
                  f"Zuletzt abgerufen: {daten['messung']}"
              )

              post = urllib.parse.urlencode({
                  "chat_id": os.environ["CHAT_ID"],
                  "text": nachricht
              }).encode("utf-8")

              req = urllib.request.Request(
                  "https://api.telegram.org/bot"
                  + os.environ["BOT_TOKEN"]
                  + "/sendMessage",
                  data=post,
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(req, timeout=20) as res:
                      antwort = json.load(res)
                  if not antwort.get("ok"):
                      raise ValueError("Telegram meldet Fehler")
              except Exception:
                  raise RuntimeError(
                      "Telegram-Versand fehlgeschlagen"
                  ) from None

              print("Telegram-Nachricht verschickt")

              if erinnerung:
                  zustand["letzte_erinnerung"] = heute
          else:
              print("Kein Telegram-Alarm erforderlich")

          zustand["unter30"] = unter30
          pfad.write_text(
              json.dumps(zustand, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alarm-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Bieralarm Status speichern"
            git pull --rebase origin main
            git push origin main
          fi

          
      - name: Fettleber Check-in Nachricht
        if: steps.abruf.outputs.fetch == 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          daten = json.loads(
              Path("bierstand.json").read_text(encoding="utf-8")
          )

          jetzt = datetime.now(ZoneInfo("Europe/Berlin"))
          biertag = (jetzt - timedelta(hours=6)).date().isoformat()

          zustandsdatei = Path("alarm-status.json")
          zustand = json.loads(
              zustandsdatei.read_text(encoding="utf-8")
          )

          neue = int(daten.get("fettleber_neue_checkins", 0))
          schon_gemeldet = (
              zustand.get("letzter_checkin_biertag") == biertag
          )

          if neue > 0 and not schon_gemeldet:
              text = "🍺 Fettleber checkt ein"

              post = urllib.parse.urlencode({
                  "chat_id": os.environ["CHAT_ID"],
                  "text": text
              }).encode("utf-8")

              req = urllib.request.Request(
                  "https://api.telegram.org/bot"
                  + os.environ["BOT_TOKEN"]
                  + "/sendMessage",
                  data=post,
                  method="POST"
              )

              with urllib.request.urlopen(req, timeout=20) as res:
                  antwort = json.load(res)

              if not antwort.get("ok"):
                  raise RuntimeError("Telegram-Versand fehlgeschlagen")

              zustand["letzter_checkin_biertag"] = biertag
              zustandsdatei.write_text(
                  json.dumps(zustand, indent=2) + "\n",
                  encoding="utf-8"
              )
              print("Erste Check-in-Nachricht versendet")
          else:
              print("Keine neue Check-in-Nachricht notwendig")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alarm-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Check-in Benachrichtigung speichern"
            git pull --rebase origin main
            git push origin main
          fi


