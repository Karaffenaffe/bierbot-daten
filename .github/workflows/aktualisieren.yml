
name: Bierbot Daten aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Bierstaende abrufen
        run: |
          python - <<'PY'
          import json
          import re
          import html
          import urllib.request
          from datetime import datetime, timezone

          def lese_unique(nutzer):
              url = f"https://untappd.com/user/{nutzer}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "text/html",
                  },
              )
   
              with urllib.request.urlopen(req, timeout=30) as res:
                  if res.status != 200:
                      raise ValueError("HTTP-Fehler")
                  print(f"=== Diagnose {nutzer} ===")
                  for feld in [
                      "Date",
                      "Age",
                      "Cache-Control",
                      "CF-Cache-Status",
                      "ETag",
                  ]:
                      print(f"{feld}: {res.headers.get(feld, 'nicht vorhanden')}")
                  seite = res.read().decode("utf-8", "replace")


              seite = re.sub(
                  r"<(script|style)\b[^>]*>.*?</\1>",
                  " ", seite, flags=re.I | re.S
              )
              seite = re.sub(r"<[^>]+>", " ", seite)
              seite = html.unescape(seite)
              seite = re.sub(r"\s+", " ", seite)

              treffer = re.findall(
                  r"(?<![\d,])(\d{1,3}(?:,\d{3})+|\d+)\s+Unique\b",
                  seite, flags=re.I
              )
              if len(treffer) != 1:
                  raise ValueError(
                      f"Keine eindeutige Unique-Zahl fuer {nutzer}"
                  )
              zahl = int(treffer[0].replace(",", ""))
              if zahl <= 0:
                  raise ValueError("Ungueltige Zahl")

          
              total_treffer = re.findall(
                  r"(?<![\d,])(\d{1,3}(?:,\d{3})+|\d+)\s+Total\b",
                  seite, flags=re.I
              )
              if len(total_treffer) != 1:
                  raise ValueError(
                      f"Keine eindeutige Total-Zahl fuer {nutzer}"
                  )
              gesamt = int(total_treffer[0].replace(",", ""))
              return zahl, gesamt


          karaffe, karaffe_total = lese_unique("Karaffenaffe")
          fettleber, fettleber_total = lese_unique("Fettleber")

          
          vorher_total = None
          try:
              with open("bierstand.json", encoding="utf-8") as f:
                  vorherige_daten = json.load(f)
              vorher_total = vorherige_daten.get("fettleber_total")
          except FileNotFoundError:
              pass

          neue_checkins = 0
          if vorher_total is not None:
              neue_checkins = max(
                  0, fettleber_total - int(vorher_total)
              )


          daten = {
              "karaffenaffe": karaffe,
              "fettleber": fettleber,
              "fettleber_total": fettleber_total,
              "fettleber_neue_checkins": neue_checkins,
              "vorsprung": karaffe - fettleber,
              "status": "ok",
              "messung": datetime.now(
                  timezone.utc
              ).isoformat(timespec="seconds")
          }

          with open("bierstand.json", "w", encoding="utf-8") as f:
              json.dump(daten, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("Karaffenaffe:", karaffe)
          print("Fettleber:", fettleber)
          print("Vorsprung:", karaffe - fettleber)
          PY

      - name: Neue Daten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bierstand.json
          if ! git diff --cached --quiet; then
            git commit -m "Bierstand aktualisieren"
            git pull --rebase origin main
            git push origin main

          fi

      - name: Telegram Bieralarm
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          daten = json.loads(
              Path("bierstand.json").read_text(encoding="utf-8")
          )

          if daten.get("status") != "ok":
              raise ValueError("Bierstand ungueltig")

          messung = datetime.fromisoformat(daten["messung"])
          if messung.tzinfo is None:
              raise ValueError("Messzeit ohne Zeitzone")
          alter = (
              datetime.now(timezone.utc) -
              messung.astimezone(timezone.utc)
          ).total_seconds()
          if alter < -300 or alter > 7200:
              raise ValueError("Bierstand nicht aktuell genug")

          jetzt = datetime.now(ZoneInfo("Europe/Berlin"))
          heute = jetzt.date().isoformat()
          vorsprung = int(daten["vorsprung"])
          unter30 = vorsprung < 30

          pfad = Path("alarm-status.json")
          zustand = (
              json.loads(pfad.read_text(encoding="utf-8"))
              if pfad.exists() else {}
          )

          vorher = zustand.get("unter30", False)
          erster_alarm = unter30 and not vorher

          erinnerung = (
              unter30
              and jetzt.hour >= 17
              and zustand.get("letzte_erinnerung") != heute
          )

          if erster_alarm or erinnerung:
              if erster_alarm:
                  titel = "🚨🍺 Fettleber ist dir auf den Fersen!"
              else:
                  titel = "🔔🍺 Aufholen, ziehs dir ryan!"

              nachricht = (
                  f"{titel}\n\n"
                  f"Karaffenaffe: {daten['karaffenaffe']} Unique\n"
                  f"Fettleber: {daten['fettleber']} Unique\n"
                  f"Vorsprung: {vorsprung} Biere\n\n"
                  f"Zuletzt abgerufen: {daten['messung']}"
              )

              post = urllib.parse.urlencode({
                  "chat_id": os.environ["CHAT_ID"],
                  "text": nachricht
              }).encode("utf-8")

              req = urllib.request.Request(
                  "https://api.telegram.org/bot"
                  + os.environ["BOT_TOKEN"]
                  + "/sendMessage",
                  data=post,
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(req, timeout=20) as res:
                      antwort = json.load(res)
                  if not antwort.get("ok"):
                      raise ValueError("Telegram meldet Fehler")
              except Exception:
                  raise RuntimeError(
                      "Telegram-Versand fehlgeschlagen"
                  ) from None

              print("Telegram-Nachricht verschickt")

              if erinnerung:
                  zustand["letzte_erinnerung"] = heute
          else:
              print("Kein Telegram-Alarm erforderlich")

          zustand["unter30"] = unter30
          pfad.write_text(
              json.dumps(zustand, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alarm-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Bieralarm Status speichern"
            git pull --rebase origin main
            git push origin main
          fi

          
      - name: Fettleber Check-in Nachricht
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          daten = json.loads(
              Path("bierstand.json").read_text(encoding="utf-8")
          )

          jetzt = datetime.now(ZoneInfo("Europe/Berlin"))
          biertag = (jetzt - timedelta(hours=6)).date().isoformat()

          zustandsdatei = Path("alarm-status.json")
          zustand = json.loads(
              zustandsdatei.read_text(encoding="utf-8")
          )

          neue = int(daten.get("fettleber_neue_checkins", 0))
          schon_gemeldet = (
              zustand.get("letzter_checkin_biertag") == biertag
          )

          if neue > 0 and not schon_gemeldet:
              text = "🍺 Fettleber checkt ein"

              post = urllib.parse.urlencode({
                  "chat_id": os.environ["CHAT_ID"],
                  "text": text
              }).encode("utf-8")

              req = urllib.request.Request(
                  "https://api.telegram.org/bot"
                  + os.environ["BOT_TOKEN"]
                  + "/sendMessage",
                  data=post,
                  method="POST"
              )

              with urllib.request.urlopen(req, timeout=20) as res:
                  antwort = json.load(res)

              if not antwort.get("ok"):
                  raise RuntimeError("Telegram-Versand fehlgeschlagen")

              zustand["letzter_checkin_biertag"] = biertag
              zustandsdatei.write_text(
                  json.dumps(zustand, indent=2) + "\n",
                  encoding="utf-8"
              )
              print("Erste Check-in-Nachricht versendet")
          else:
              print("Keine neue Check-in-Nachricht notwendig")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alarm-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Check-in Benachrichtigung speichern"
            git pull --rebase origin main
            git push origin main
          fi


