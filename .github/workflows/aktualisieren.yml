
name: Bierbot Daten aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Bierstaende abrufen
        run: |
          python - <<'PY'
          import json
          import re
          import html
          import urllib.request
          from datetime import datetime, timezone

          def lese_unique(nutzer):
              url = f"https://untappd.com/user/{nutzer}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "text/html",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as res:
                  if res.status != 200:
                      raise ValueError("HTTP-Fehler")
                  seite = res.read().decode("utf-8", "replace")

              seite = re.sub(
                  r"<(script|style)\b[^>]*>.*?</\1>",
                  " ", seite, flags=re.I | re.S
              )
              seite = re.sub(r"<[^>]+>", " ", seite)
              seite = html.unescape(seite)
              seite = re.sub(r"\s+", " ", seite)

              treffer = re.findall(
                  r"(?<![\d,])(\d{1,3}(?:,\d{3})+|\d+)\s+Unique\b",
                  seite, flags=re.I
              )
              if len(treffer) != 1:
                  raise ValueError(
                      f"Keine eindeutige Unique-Zahl fuer {nutzer}"
                  )
              zahl = int(treffer[0].replace(",", ""))
              if zahl <= 0:
                  raise ValueError("Ungueltige Zahl")
              return zahl

          karaffe = lese_unique("Karaffenaffe")
          fettleber = lese_unique("Fettleber")

          daten = {
              "karaffenaffe": karaffe,
              "fettleber": fettleber,
              "vorsprung": karaffe - fettleber,
              "status": "ok",
              "messung": datetime.now(
                  timezone.utc
              ).isoformat(timespec="seconds")
          }

          with open("bierstand.json", "w", encoding="utf-8") as f:
              json.dump(daten, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("Karaffenaffe:", karaffe)
          print("Fettleber:", fettleber)
          print("Vorsprung:", karaffe - fettleber)
          PY

      - name: Neue Daten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bierstand.json
          if ! git diff --cached --quiet; then
            git commit -m "Bierstand aktualisieren"
            git pull --rebase origin main
            git push origin main

          fi
